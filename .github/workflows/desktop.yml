name: RoarMind for Mac

# Builds RoarMind for Mac (.dmg, Apple Silicon and Intel, with its helper) and puts it on a GitHub release, whose files
# are the download links (and what the app's own updater looks at). Runs on a tag v* or from the Actions tab.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      # GitHub's Macs sometimes fail to make a .dmg ("hdiutil: resource busy"): up to three tries
      - shell: bash
        run: |
          for i in 1 2 3; do
            if npm run dist:mac > build.log 2>&1; then cat build.log; exit 0; fi
            echo "attempt $i failed"; tail -40 build.log; hdiutil detach /Volumes/RoarMind -force || true; rm -rf out; sleep 10
          done
          echo "::error title=Mac build::$(tail -25 build.log | tr '\n' ' ' | cut -c1-3500)"
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: roarmind-mac
          path: out/*.dmg
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: package.json
          sparse-checkout-cone-mode: false
      - id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      # a copy under a plain name too, so a link to releases/latest/download/RoarMind-Mac-arm64.dmg always works
      - run: |
          cd files
          for f in *; do
            case "$f" in
              *-Mac-arm64.dmg) cp "$f" RoarMind-Mac-arm64.dmg ;;
              *-Mac-x64.dmg) cp "$f" RoarMind-Mac-x64.dmg ;;
            esac
          done
          ls -la
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: RoarMind ${{ steps.v.outputs.version }} beta · ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build {0}', github.run_number) }}
          make_latest: true
          body: |
            RoarMind ${{ steps.v.outputs.version }} beta for Mac.

            Mac with Apple Silicon (M1, M2, M3, M4): RoarMind-Mac-arm64.dmg · Mac with Intel: RoarMind-Mac-x64.dmg

            First open: right-click RoarMind > Open (or System Settings > Privacy & Security > Open Anyway), once. The AI runs through Ollama (ollama.com), on this Mac.
          files: files/*
